name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker, sandbox]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Publish node-sdk when its version is new
        working-directory: packages/node-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on npm already"
          else
            pnpm publish --access public --no-git-checks
          fi

  release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Cleans the notes the same way as the update popover in the app: no HTML comments, no
        # "What's Changed" or "Full Changelog" lines, no release chores, no "by @user in <url>"
        # ends. Headings become bold lines. A single heading goes away.
        run: |
          gh release view "$GITHUB_REF_NAME" --json body,url,publishedAt \
            | jq --arg title "zerodot $GITHUB_REF_NAME" '
              (.body
                | gsub("<!--[\\s\\S]*?-->"; "") | gsub("\r"; "") | split("\n")
                | map(select(test("^#+\\s+what.s changed\\s*$"; "i") | not))
                | map(select(test("^\\**full changelog"; "i") | not))
                | map(select(test("^\\s*[-*+]\\s+chore(\\([^)]*\\))?:\\s*release\\b"; "i") | not))
                | map(if test("^\\s*[-*+]\\s+")
                    then sub("\\s+by\\s+@[\\w-]+(\\s+in\\s+\\S+)?\\s*$"; "") | sub("^\\s*[-*+]\\s+"; "- ")
                    else . end)
              ) as $lines
              | [$lines[] | select(test("^#+\\s+"))] as $heads
              | ($lines
                | if ($heads | length) == 1 then map(select(. != $heads[0])) else . end
                | map(sub("^#+\\s+(?<h>.+)$"; "\n**\(.h)**"))
                | join("\n") | gsub("\\A\\s+|\\s+\\z"; "") | .[0:4000]) as $notes
              | {embeds: [{
                  title: $title,
                  url: .url,
                  description: (if $notes == "" then null else $notes end),
                  color: 16742656,
                  timestamp: .publishedAt
                }]}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
