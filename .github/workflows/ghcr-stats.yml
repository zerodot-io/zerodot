name: ghcr-stats

# Counts the pulls of the zerodot image once a day. The count goes to the ghcr-stats branch, not main.
# The README badge reads zerodot.json from that branch. web, api, worker and sandbox use this one image.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ghcr-stats
      # Pinned to a commit (v1.0.4). The action reads the public package page.
      - uses: actionstore/ghcr-stats@3bf18e157b9a95158e54c0f6c4f72b61f67fba39
        with:
          owner: zerodot-io
          repo: zerodot
          name: zerodot
          path: zerodot.json
      - name: Commit the count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zerodot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ghcr stats"
            git push
          fi
